<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3F1220">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <title>Entrar · Gregórios Restaurantes</title>
  <link rel="icon" href="assets/img/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Karla:ital,wght@0,400;0,500;0,700;1,400&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/paginas.css">
</head>
<body>
  <div id="cabecalho"></div>
  <main class="secao wrap">
    <h1 class="titulo-secao">Entrar na Conta</h1><div class="divisor"></div>

    <form class="moldura cartao-form" id="form-login" novalidate>
      <i class="canto tl"></i><i class="canto tr"></i><i class="canto bl"></i><i class="canto br"></i>
      <p class="tagline" style="text-align:center;margin-bottom:1.3rem">Bem-vindo de volta — sua mesa está reservada.</p>

      <div class="campo"><label for="email">E-mail</label><input id="email" type="email" required placeholder="voce@email.com" autofocus></div>
      <div class="campo"><label for="senha">Senha</label><input id="senha" type="password" required placeholder="••••••••"></div>

      <div id="erro" hidden style="background:rgba(90,27,44,.08);color:var(--vinho);border-left:4px solid var(--vinho);padding:.7rem 1rem;border-radius:0 8px 8px 0;font-size:.85rem;margin-bottom:.8rem"></div>

      <button class="btn" type="submit" style="width:100%;justify-content:center">Entrar</button>

      <p style="text-align:center;margin-top:1.3rem;font-size:.88rem">
        Ainda não tem conta? <a href="cadastro.html" style="color:var(--vinho);font-weight:700">Criar agora</a>
      </p>

      <div class="aviso-demo" style="margin-top:1.2rem;text-align:center">
        <strong>Demo:</strong> <code>cliente@gregorios.com.br</code> · senha <code>123456</code>
      </div>
    </form>
  </main>
  <div id="rodape"></div>
  <script src="js/api.js"></script><script src="js/estado.js"></script><script src="js/ui.js"></script>
  <script src="js/paginas/login.js"></script>
</body>
</html>
