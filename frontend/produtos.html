<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3F1220">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <title>Cardápio · Gregórios Restaurantes</title>
  <meta name="description" content="Pizzas no forno a lenha, cozinha mediterrânea, grelhados e adega. Peça entrega ou retirada.">
  <link rel="icon" href="assets/img/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Karla:ital,wght@0,400;0,500;0,700;1,400&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/paginas.css">
</head>
<body>
  <div id="cabecalho"></div>

  <main class="secao wrap">
    <h1 class="titulo-secao">Cardápio</h1><div class="divisor"></div>
    <p class="tagline" style="text-align:center">Do forno a lenha à brasa — escolha, monte a cesta e peça.</p>

    <div class="toolbar">
      <div class="busca"><input id="busca" type="search" placeholder="Buscar prato ou ingrediente…" aria-label="Buscar no cardápio"></div>
      <select id="ordem" class="select-ordem" aria-label="Ordenar por">
        <option value="">Ordenar: destaques</option>
        <option value="preco-asc">Menor preço</option>
        <option value="preco-desc">Maior preço</option>
        <option value="nome">Nome (A–Z)</option>
      </select>
    </div>

    <div class="chips" id="chips" role="tablist" aria-label="Categorias"></div>
    <p class="contagem" id="contagem"></p>

    <div class="grade-produtos" id="grade" style="margin-top:.9rem"></div>
  </main>

  <div id="rodape"></div>
  <script src="js/api.js"></script><script src="js/estado.js"></script><script src="js/ui.js"></script>
  <script src="js/paginas/produtos.js"></script>
</body>
</html>
